<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AK ARMY | Gaming Profile</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Arial,Helvetica,sans-serif;background:#050505;color:#fff;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:
radial-gradient(circle at 15% 20%,rgba(255,0,0,.16),transparent 28%),
radial-gradient(circle at 85% 70%,rgba(255,0,0,.10),transparent 30%);
pointer-events:none}
nav{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:18px 7%;
background:rgba(0,0,0,.72);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,0,0,.25)}
.logo{font-size:24px;font-weight:900;letter-spacing:3px;color:#f11}
nav a{color:#ddd;text-decoration:none;margin-left:25px;font-size:13px;font-weight:bold}
nav a:hover{color:#f22}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:110px 20px 50px;position:relative}
.hero-card{max-width:950px}
.hero img{width:min(310px,75vw);aspect-ratio:1;object-fit:cover;border-radius:25px;border:2px solid #f11;box-shadow:0 0 45px rgba(255,0,0,.35);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
h1{font-size:clamp(48px,10vw,105px);line-height:.9;margin-top:30px;font-weight:1000;letter-spacing:5px;text-shadow:0 0 25px rgba(255,0,0,.45)}
h1 span{color:#f11}
.tag{margin:22px auto;color:#bbb;letter-spacing:4px;font-weight:bold}
.btn{display:inline-block;margin:8px;padding:13px 24px;border-radius:6px;text-decoration:none;font-weight:900;color:#fff;border:1px solid #f11;background:#e50909;box-shadow:0 0 20px rgba(255,0,0,.25)}
.btn.alt{background:transparent}
section{padding:90px 7%;position:relative}
.title{text-align:center;font-size:38px;margin-bottom:40px}
.title span{color:#f11}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:1100px;margin:auto}
.box{padding:28px;background:linear-gradient(145deg,#121212,#070707);border:1px solid #222;border-radius:15px;text-align:center}
.box:hover{border-color:#e11;transform:translateY(-4px);transition:.2s}
.shop-card h3{margin:12px 0 5px;font-size:21px}.shop-btn{margin-top:18px;font-size:13px;padding:11px 20px}
.num{font-size:38px;font-weight:900;color:#f11}
.small{color:#999;margin-top:7px}
.about{max-width:850px;margin:auto;text-align:center;color:#bbb;line-height:1.8;font-size:17px}
.social{text-align:center}
.social a{display:inline-block;margin:8px;padding:15px 25px;border:1px solid #333;border-radius:8px;color:#fff;text-decoration:none}
.social a:hover{border-color:#f11;color:#f11}
footer{text-align:center;padding:30px;color:#666;border-top:1px solid #222}
#top{position:fixed;right:20px;bottom:20px;background:#e11;color:white;border:0;border-radius:50%;width:45px;height:45px;cursor:pointer;font-size:20px}
@media(max-width:700px){nav a{margin-left:10px;font-size:11px}.grid{grid-template-columns:1fr}.title{font-size:30px}}
</style>
</head>
<body>
<nav>
<div class="logo">AK ARMY</div>
<div>
$1#$2</a>
$1#$2</a>
$1#$2</a>
</section>

<footer>© 2026 AK ARMY • PLAY // FIGHT // WIN</footer>
<button id="top" onclick="scrollTo({top:0,behavior:'smooth'})">↑</button>
</body>
</html>
